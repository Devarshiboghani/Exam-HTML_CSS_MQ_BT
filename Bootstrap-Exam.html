.banner-btn {

.banner-btn button {

	border-radius: 8px;
	color: #fff;
	background-color: #ea4020;
	font-size:16px;
}
.banner-top {
    width: 500px;
    height: 500px;
	padding: 45px;
	position: relative;
	margin-top:80px;
}
.banner-img {
     width: 450px;
    height: 400px;
	border-radius: 50% 40% 0% 50%;
	border: 15px solid #292929 !important;
	position: relative;
	z-index: 99;
	overflow: hidden;
}
.banner-img img {
	width: 550px;
    height: 400px;
}

.banner-top:after {
	content: "";
	position: absolute;
	bottom: 0;
	top: 0;
	left: 0;
    width: 200vw;
	border: 20px solid #ea4020;
	border-radius: 310px;
	background: #fff;
}
.typing {
	position: relative;
    width:fit-content;

}

@media only screen and (max-width:768px) {
.banner-left h1 {

.banner-left h3 {
 font-size: 22px;
}
.banner-left .head-bottom {
 height: 2px;
 width: 90px;
}
}
